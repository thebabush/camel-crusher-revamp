# Install with `pre-commit install` (or `uvx pre-commit install`).
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo lint
        language: system
        types_or: [rust, toml]
        pass_filenames: false
